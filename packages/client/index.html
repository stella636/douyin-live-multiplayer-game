<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖音直播间盒子大战</title>
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        overflow: hidden;
      }

      #app {
        position: relative;
      }

      #camera-layer,
      #game-layer {
        position: absolute;
        inset: 0;
      }

      #camera-layer {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.5)),
          #0f172a;
      }

      #camera-feed {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0.9;
      }

      #camera-overlay {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 10px 14px;
        border-radius: 14px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
      }

      canvas {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="camera-layer">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div id="camera-overlay">摄像头未连接</div>
      </div>
      <div id="game-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
